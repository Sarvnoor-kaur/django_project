{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
  {% for message in messages %}
  <div class="flex items-center gap-3 p-4 mb-3 rounded-lg border {% if message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800{% elif message.tags == 'error' or message.tags == 'danger' %}bg-red-50 border-red-200 text-red-800{% elif message.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}">
    <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill text-emerald-500{% elif message.tags == 'error' or message.tags == 'danger' %}bi-exclamation-circle-fill text-red-500{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill text-amber-500{% else %}bi-info-circle-fill text-blue-500{% endif %} text-lg"></i>
    <span class="text-sm font-medium flex-1">{{ message }}</span>
    <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600"><i class="bi bi-x-lg"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
