{% extends 'base.html' %}
{% block title %}404 – Page Not Found | SmartEdu{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-16 px-4">
  <div class="text-center max-w-lg space-y-6">
    <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-brand-50 text-brand-600 text-5xl font-black mb-2 shadow-inner">
      404
    </div>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">
      Page Not Found
    </h1>
    <p class="text-gray-500 text-sm sm:text-base leading-relaxed">
      Sorry, the page or educational module you are trying to reach does not exist or has been relocated.
    </p>
    <div class="pt-4 flex flex-wrap justify-center gap-4">
      <a href="{% url 'home' %}" class="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-md transition-all">
        <i class="bi bi-house-door mr-2"></i>Back to Home
      </a>
      <a href="{% url 'about' %}" class="px-6 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold text-sm transition-all">
        Learn About SmartEdu
      </a>
    </div>
  </div>
</div>
{% endblock %}
